name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: P-layer version
      description: Settings → Version
      placeholder: 1.9.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: Pixel 8, Android 15
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: Audio format (if it matters)
      placeholder: FLAC 24-bit, MP3 with embedded lyrics…
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs